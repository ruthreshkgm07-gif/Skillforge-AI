version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: skillforge-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillforge_db}
      POSTGRES_USER: ${POSTGRES_USER:-skillforge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skillforge_password_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillforge_user} -d ${POSTGRES_DB:-skillforge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skillforge-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    container_name: skillforge-ml-service
    restart: always
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: skillforge-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-skillforge_db}
      - POSTGRES_USER=${POSTGRES_USER:-skillforge_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-skillforge_password_secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ML_SERVICE_URL=http://ml-service:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-placeholder-key}
      - JWT_SECRET=${JWT_SECRET:-404D635166546A576E5A7234753778214125442A472D4B6150645267556B5870}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: skillforge-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
